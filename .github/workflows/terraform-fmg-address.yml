name: Terraform FMG Address Object

on:
  push:
    branches:
      - fmg
    paths:
      - 'fmg/**'
      - 'fmg/.github/workflows/terraform-fmg-address.yml'
  pull_request:
    branches:
      - fmg
    paths:
      - 'github.com-openstack-dev-dev-stack/**'

env:
  TF_VERSION: 1.5.0
  TERRAFORM_DIR: ./fmg

jobs:
  terraform:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: ${{ env.TF_VERSION }}
      
      - name: Terraform Init
        run: terraform init
        working-directory: ${{ env.TERRAFORM_DIR }}
      
      - name: Terraform Format Check
        run: terraform fmt -check -recursive
        working-directory: ${{ env.TERRAFORM_DIR }}
        continue-on-error: true
      
      - name: Terraform Validate
        run: terraform validate
        working-directory: ${{ env.TERRAFORM_DIR }}
      
      - name: Terraform Plan
        run: terraform plan -out=tfplan -input=false
        working-directory: ${{ env.TERRAFORM_DIR }}
        env:
          FMG_API_TOKEN: ${{ secrets.FMG_API_TOKEN }}
      
      - name: Terraform Apply
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: terraform apply -auto-approve -input=false tfplan
        working-directory: ${{ env.TERRAFORM_DIR }}
        env:
          FMG_API_TOKEN: ${{ secrets.FMG_API_TOKEN }}
      
      - name: Terraform Plan Output (PR)
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync('${{ env.TERRAFORM_DIR }}/tfplan', 'utf8');
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '## Terraform Plan Output\n```\n' + plan + '\n```'
            });
